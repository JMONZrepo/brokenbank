# GoCortex Broken Bank - Apache site for the PHP eStatements portal.
# Serves the source-built PHP 8.4.26 mod_php on port 8085.

Listen 8085

ServerName brokenbank.local

<VirtualHost *:8085>
    DocumentRoot /var/www/html

    # Hand .php files to the mod_php (PHP2Shell-affected) runtime.
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        # Directory listing left on (CWE-548): the /uploads/ directory can be
        # browsed, so a dropped webshell is easy to find.
        Options +Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # The upload target is world-writable so mod_php (running as www-data)
    # can drop files there, which is also what makes the webshell path work.
    <Directory /var/www/html/uploads>
        Options +Indexes
        Require all granted
    </Directory>

    # Combined access log, shipped to the SIEM by the log forwarder.
    CustomLog /var/log/apache2/estatements_access.log combined
    ErrorLog /var/log/apache2/estatements_error.log
</VirtualHost>
