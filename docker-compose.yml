#
# GoCortex Broken Bank - Five Servers, Seven Port Listeners
# Flask/Gunicorn (8888), Tomcat (9999), React/Next.js SpaceATM (7777), Live Transaction Ticker (6666),
# PHP eStatements portal (port 8085), plus sshd (2222) and the in-process OTel Prometheus scrape (9464)
services:
  gocortex-broken-bank:
    build: .
    ports:
      - "8888:8888"   # Flask/Gunicorn - Banking UI and SAST endpoints
      - "9999:8080"   # Tomcat - Java exploit endpoints and Spring4Shell
      - "7777:7777"    # React/Next.js - SpaceATM Terminal and CVE-2025-55182
      - "9464:9464"   # OTel metrics scrape endpoint (Prometheus format)
      - "2222:22"     # sshd - leaked deployment key / weak root password login
      - "6666:6666"   # Live Transaction Ticker (WebSocket)
      - "8085:8085"   # PHP eStatements portal - Apache mod_php 8.4.26 (PHP2Shell)
    # Values below use ${VAR:-default} substitution, so Compose picks them up
    # from a .env file sitting beside this one if present, and falls back to
    # the defaults when it is absent. Copy .env.example to .env and edit that
    # rather than editing config/*.yaml inside a running container, whose
    # changes are lost the moment it is recreated. .env is gitignored.
    environment:
      - SESSION_SECRET=hardcoded-docker-secret-key
      - DATABASE_URL=sqlite:///app/instance/gocortexbrokenbank.db
      - FLASK_ENV=production
      - LOCALE=${LOCALE:-en}  # Supported: en (English/Australian), kr (Korean)
      # Concierge LLM backend - see config/concierge.yaml
      - CONCIERGE_PROVIDER=${CONCIERGE_PROVIDER:-local}
      - CONCIERGE_SYSTEM_PROMPT=${CONCIERGE_SYSTEM_PROMPT:-full}
      - PORTKEY_API_KEY=${PORTKEY_API_KEY:-}
      - PORTKEY_MODEL=${PORTKEY_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # SIEM log shipping - see config/logging.yaml
      - LOG_SHIPPING_ENABLED=${LOG_SHIPPING_ENABLED:-false}
      - LOG_ENDPOINT_TOMCAT_ACCESS=${LOG_ENDPOINT_TOMCAT_ACCESS:-}
      - LOG_AUTH_TOMCAT_ACCESS=${LOG_AUTH_TOMCAT_ACCESS:-}
      - LOG_ENDPOINT_NETBANK_APP=${LOG_ENDPOINT_NETBANK_APP:-}
      - LOG_AUTH_NETBANK_APP=${LOG_AUTH_NETBANK_APP:-}
      - LOG_ENDPOINT_NETBANK_CONCIERGE=${LOG_ENDPOINT_NETBANK_CONCIERGE:-}
      - LOG_AUTH_NETBANK_CONCIERGE=${LOG_AUTH_NETBANK_CONCIERGE:-}
      - LOG_ENDPOINT_NETBANK_AUTH=${LOG_ENDPOINT_NETBANK_AUTH:-}
      - LOG_AUTH_NETBANK_AUTH=${LOG_AUTH_NETBANK_AUTH:-}
    volumes:
      - ./instance:/app/instance
      # Bind-mounting config/ means edits survive a container rebuild or
      # recreate. Without this, anything changed inside the container is lost
      # when it is replaced, because the image ships its own copy. The host
      # directory is the same one COPY put in the image, so contents match.
      - ./config:/app/config
    restart: unless-stopped
    container_name: gocortex-broken-bank