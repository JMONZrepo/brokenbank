[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:gunicorn]
command=gunicorn --bind 0.0.0.0:8888 --workers 1 --threads 4 --reload main:app
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/gunicorn.err.log
stdout_logfile=/var/log/supervisor/gunicorn.out.log
priority=100

[program:tomcat]
command=/bin/bash -c 'export JAVA_HOME=$(grep JAVA_HOME /etc/environment | cut -d= -f2) && /opt/tomcat/bin/catalina.sh run'
directory=/opt/tomcat
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/tomcat.err.log
stdout_logfile=/var/log/supervisor/tomcat.out.log
priority=200
environment=CATALINA_HOME="/opt/tomcat"

[program:log-forwarder]
command=python /app/scripts/log-forwarder.py --log-path /opt/tomcat/logs
directory=/app
autostart=true
autorestart=true
startsecs=10
stderr_logfile=/var/log/supervisor/log-forwarder.err.log
stdout_logfile=/var/log/supervisor/log-forwarder.out.log
priority=300

[program:spaceatm]
command=npx next start -p 7777
directory=/app/react-app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/spaceatm.err.log
stdout_logfile=/var/log/supervisor/spaceatm.out.log
priority=400
environment=NODE_ENV="production"

[program:sshd]
; sshd requires /run/sshd (its privilege-separation directory) to exist before
; it will start. A real init system normally creates this at boot; nothing
; does that here, and /run is a fresh tmpfs on every container start (not
; something the Dockerfile can create once at build time), so it is created
; here on every launch instead.
command=/bin/sh -c 'mkdir -p /run/sshd && exec /usr/sbin/sshd -D -e'
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log
priority=500

[program:cron]
command=cron -f
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/cron.err.log
stdout_logfile=/var/log/supervisor/cron.out.log
priority=600

[program:ticker]
command=node server.js
directory=/app/ticker-service
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/ticker.err.log
stdout_logfile=/var/log/supervisor/ticker.out.log
priority=700
environment=TICKER_PORT="6666"

[program:php-apache]
; PHP 8.4.26 eStatements portal via Apache mod_php on port 8085 (PHP2Shell:
; CVE-2026-109618 / CVE-2026-109619). Apache's runtime directories live under
; /run, a fresh tmpfs on every container start, so they are created here each
; launch before apache is exec'd in the foreground. envvars sets APACHE_*.
command=/bin/bash -c 'source /etc/apache2/envvars && mkdir -p "$APACHE_RUN_DIR" "$APACHE_LOCK_DIR" "$APACHE_LOG_DIR" && exec apache2 -D FOREGROUND'
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-apache.err.log
stdout_logfile=/var/log/supervisor/php-apache.out.log
priority=800
