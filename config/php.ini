;
; GoCortex Broken Bank - PHP configuration for the eStatements portal
;
; Deliberately insecure settings for Cortex Cloud configuration/IaC scanning
; and for the PHP2Shell (CVE-2026-109618 / CVE-2026-109619) training scenario.
; Loaded by the source-built PHP 8.4.26 mod_php running under Apache.

; --- PHP2Shell delivery-path precondition --------------------------------
; session.upload_progress is the code path the advisories describe. It is On
; by factory default; it is set explicitly here so the condition is visible
; to config scanners and obvious to learners.
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS

; --- weak settings a configuration scanner should flag -------------------
; Remote file inclusion: allows download.php's include() to pull a remote URL.
allow_url_fopen = On
allow_url_include = On
; Verbose errors leak paths and stack context to unauthenticated clients.
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
; Advertises the PHP version in the Server/X-Powered-By headers.
expose_php = On
; A finite memory_limit is what makes the out-of-memory fatal error (the
; PHP2Shell trigger) reachable. The factory default is left in place.
memory_limit = 128M
; Large uploads are accepted, matching a statement-intake portal.
upload_max_filesize = 64M
post_max_size = 72M
file_uploads = On
; No open_basedir restriction, so the LFI in download.php reaches the whole
; filesystem rather than being confined to the portal directory.
;open_basedir =
